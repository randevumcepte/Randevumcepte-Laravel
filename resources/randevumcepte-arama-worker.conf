; Supervisor — Santral (FreePBX) hatirlatma aramasi kuyruk isleyicisi.
; Eczane24'teki worker ile ayni mantik (supervisor).
;
; Reklam (kampanyaarama:yap), randevu (randevuarama:yap) ve alacak
; (alacakhatirlatma:aramayap) komutlari arama islerini HatirlatmaAramaJob ile
; `database` kuyruguna (queue: hatirlatmalar / notifications) ekler. Bu surec
; o isleri cekip Asterisk AMI Originate'i gerceklestirir.
;
; KURULUM (prod sunucuda, root/sudo ile):
;   cp resources/randevumcepte-arama-worker.conf /etc/supervisor/conf.d/
;   supervisorctl reread
;   supervisorctl update            # program'i ekler ve baslatir
;   supervisorctl status randevumcepte-arama-worker
;
; deploy.sh her deploy'da `php artisan queue:restart` cagirir → bu worker
; nazikce yeniden baslar ve guncel job koduyla devam eder (supervisor canli tutar).
;
; NOT: --timeout (1700) config/queue.php database.retry_after (1800) degerinden
; KUCUK olmali; aksi halde uzun suren bir is kuyruga geri dusup ayni numaralar
; MUKERRER aranir. stopwaitsecs=1800 → restart sirasinda suren bir arama partisi
; yarida kesilmez.

[program:randevumcepte-arama-worker]
process_name=%(program_name)s
command=/opt/php74/bin/php /var/www/www-root/data/www/randevumceptetest/artisan queue:work database --queue=hatirlatmalar,notifications --sleep=3 --tries=1 --timeout=1700
directory=/var/www/www-root/data/www/randevumceptetest
user=www-root
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=1800
redirect_stderr=true
stdout_logfile=/var/www/www-root/data/www/randevumceptetest/storage/logs/arama-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
